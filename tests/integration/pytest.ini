[pytest]
# Pytest configuration for integration tests

# Test discovery
testpaths = tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Integration test markers
markers =
    integration: marks tests as integration tests (real component interaction)
    slow: marks tests taking >30 seconds (deselect with '-m "not slow"')
    network: marks tests requiring network (skip with -m "not network")
    website: marks tests hitting real websites (with rate limiting protection)
    provider: marks tests using real TTS providers (may be slow/unreliable)
    file_ops: marks tests performing real file operations
    serial: marks tests requiring sequential execution
    timeout: marks tests with custom timeout duration

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=src --cov-report=html --cov-report=term


