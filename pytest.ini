[pytest]
# Pytest configuration for ACT project

# Test categorization markers
markers =
    # Test types
    unit: marks tests as unit tests (isolated component testing)
    integration: marks tests as integration tests (component interaction)
    e2e: marks tests as end-to-end tests (full pipeline testing)

    # Test characteristics
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network connection (deselect with '-m "not network"')
    asyncio: marks tests as async tests
    benchmark: marks tests as performance benchmarks
    property: marks tests as property-based tests

    # Execution control
    serial: marks tests that must run sequentially (disables parallel execution)
    no_parallel: marks tests that should not run in parallel
    ui: marks tests as UI tests (Qt/PySide6 components, run sequentially)
    timeout: marks tests with timeout configuration

    # Test focus areas
    error_handling: marks error handling and exception tests
    edge_case: marks edge case and boundary condition tests
    serialization: marks serialization/persistence tests
    validation: marks input validation tests

    # Special test types
    circuit_breaker: marks circuit breaker tests that require isolation
    real: marks tests that perform real operations (not mocked)
    smoke: marks quick smoke tests for basic functionality

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --ignore="tests/unit/old ui test"
    --ignore="tests/legacy"
    -n auto
    --dist worksteal
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml

# pytest-xdist configuration is handled by -n auto in addopts

# Disable parallel execution for UI tests (Qt threading issues)
filterwarnings =
    ignore:.*Qt.*:pytest.PytestUnraisableExceptionWarning
    # Suppress pydub SyntaxWarnings about invalid escape sequences
    ignore:invalid escape sequence.*:SyntaxWarning
    ignore:.*pydub.*:SyntaxWarning

# Coverage configuration moved to .coveragerc

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Note: pytest-asyncio configuration is done in conftest.py
# Install pytest-asyncio with: pip install pytest-asyncio

